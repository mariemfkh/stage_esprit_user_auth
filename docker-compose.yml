version: '3.8'

services:
  ms-auth:
    build:
      context: .
      target: builder # Use builder stage for dev (to have nodemon/nest dev server) or adjust as needed. For prod use the default target
      dockerfile: Dockerfile
    image: ms-auth-dev
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/stage_esprit_auth
      - JWT_SECRET=super_secret_dev_key
      - JWT_EXPIRATION=15m
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
